name: Bug report
description: hiruzen crashes, will not start, or draws the dropdown wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Check the [Troubleshooting](https://github.com/yieldwerx-sc/hiruzen-cli#troubleshooting) table first: it covers the common startup messages.
        For missing or wrong suggestions, use the "Wrong or missing suggestions" template instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what hiruzen did instead. Paste any message it printed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new terminal
        2. Type `git ch`
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hiruzen version
      description: Output of `hiruzen --version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - zsh
        - bash
        - fish
        - PowerShell
        - cmd
        - Git Bash
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: Terminal
      description: The terminal app and version, and tmux or screen if you use one
      placeholder: iTerm2 3.5, inside tmux 3.4
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, your prompt or shell plugins, or anything unusual about your setup

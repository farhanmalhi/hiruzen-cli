name: Feature request
description: Suggest a change or an addition to hiruzen
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How hiruzen should behave. Include the keys, command or output you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have tried
